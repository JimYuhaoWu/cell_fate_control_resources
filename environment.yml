# Conda environment for CFCR.
#
# The name is `cfcr`, a sibling of the `ecr` environment used by eCR_mod_lib
# rather than a reuse of it: `conda env create` refuses to write into an
# existing environment, so sharing the name would make this file unusable on
# any machine that already has `ecr` -- which is every machine that runs the
# module library. Both environments can be active in separate shells, and
# eCR_mod_lib stays importable from `cfcr` if it is pip-installed into it.
name: cfcr
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pandas
  - pyyaml
  # For literature/01_search.py only. `requests` rather than httpx or a retry
  # library because eCR_mod_lib's pipeline, which M3 adapts, already retries on
  # a plain requests.Session -- three attempts, Retry-After honoured, 2**n
  # backoff -- and matching it is cheaper than porting it to something else.
  - requests
  - pip
