[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfcr"
version = "0.1.0"
description = "Cell Fate Control Resources: a curated index of models, benchmarks, datasets, module collections, protocols and databases for controlling cell fate"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yuhao Wu" }]
keywords = ["genomics", "cell fate", "chromatin", "deep learning", "curation"]
dependencies = [
    "pandas",
    "pyyaml",
    # The author-overlap derivation behind `evidence_tier`, owned by
    # WhoChecked so that two projects cannot hold two copies of it. Pinned to a
    # commit, not a branch: the QC story here is that a rebuild reproduces the
    # committed snapshots byte for byte, and a dependency that computes
    # `evidence_tier` cannot be allowed to move underneath that claim. Bumping
    # the pin is a visible commit, which is the right weight for a change to
    # the one thing CFCR rests on.
    "whochecked @ git+https://github.com/JimYuhaoWu/WhoChecked@603778d",
]

# The literature pipeline is the only thing here that touches the network, and
# `pip install cfcr` is for querying the committed snapshots -- which needs no
# network at all. Keeping `requests` out of the runtime dependencies is what
# makes that claim in README true, so it goes in an extra:
#     pip install -e ".[literature]"
[project.optional-dependencies]
literature = ["requests"]

[project.urls]
Homepage = "https://github.com/JimYuhaoWu/cell_fate_control_resources"
Repository = "https://github.com/JimYuhaoWu/cell_fate_control_resources"

[tool.setuptools.packages.find]
where = ["."]
include = ["cfcr*"]
