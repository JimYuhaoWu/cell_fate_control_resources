- entity_id: model:flashzoi
  type: model
  name: Flashzoi
  aliases: [flashzoi, borzoi-pytorch]
  year: 2024
  description: >
    Re-implementation of Borzoi substituting rotary positional encodings and
    FlashAttention-2 for relative positional encodings, giving over 3-fold
    faster training and inference and up to 2.4-fold lower memory use while
    maintaining or improving accuracy.
  notes: >
    A port under its own name, so a separate entity with `variant_of` rather
    than a Borzoi link -- the granularity rule's worked case. Weights for all
    four Flashzoi and Borzoi replicates are published together under MIT; the
    replicates are one entity, not four. Licensed more permissively than Borzoi
    itself, which matters for downstream reuse.
  tags: [flash-attention, rotary-embedding, efficiency, gagneur]
  fate_axis: [where]
  organism: [human, mouse]
  assay: [RNA-seq, DNase-seq, ATAC-seq, ChIP-seq, CAGE]
  task: [coverage-prediction, variant-effect-prediction, enhancer-promoter-linking]
  status: active
  variant_of: model:borzoi
  curator: JimYuhaoWu
  date_added: 2026-10-16
  model_ext:
    evidence_tier: externally-benchmarked
    availability_tier: open-source
    model_family: interval-model
    architecture: [cnn, transformer]
    input_type: genomic-interval
    input_context_bp: 524288
    output_type: [coverage-track, variant-effect]
    output_resolution_bp: 32
    n_parameters_min: null      # FLAG: not stated in the abstract; unverified
    n_parameters_max: null
    genome_build: [hg38, mm10]
    license: MIT
  links:
    - kind: code
      url: https://github.com/johahi/borzoi-pytorch
    - kind: weights
      url: https://huggingface.co/johahi
