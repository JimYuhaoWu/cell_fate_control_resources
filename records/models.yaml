# records/models.yaml
#
# Human-curated source of truth for `type: model` entities.
#
# Conventions:
#   * entity_id prefix MUST equal `type` (QC enforces it), so models are
#     `model:<slug>`.
#   * `evidence_tier` below is the curator's CLAIM. 05_validate.py recomputes it
#     from entity_paper roles + author overlap and reports disagreements; the
#     derivation is authoritative (schema §3.1).
#   * Replicate checkpoints of one model are ONE entity. A re-implementation
#     under its own name is a separate entity with `variant_of` set. A successor
#     with its own paper is a separate entity with `supersedes` set.
#   * `status` describes this entity only. Borzoi claiming to supersede Enformer
#     does not make Enformer `superseded` -- succession is a claim made by the
#     follower, not a fact about the precedent, and Enformer remains actively
#     used and maintained.
#   * Fields that could not be verified against an API are null and listed in
#     reports/seed_flags.md. Nothing here is written from memory.

- entity_id: model:enformer
  type: model
  name: Enformer
  aliases: [enformer]
  year: 2021
  description: >
    Predicts gene expression and chromatin tracks from DNA sequence by combining
    dilated convolutions with transformer blocks, integrating regulatory
    information from up to 100 kb away. Established the long-context interval
    model as the dominant architecture for sequence-to-function prediction.
  notes: >
    The reference point the whole interval-model literature argues with. Two
    independent Nature Genetics analyses (Tang/Toneyan/Koo and Huang et al.)
    found it explains personal transcriptome variation poorly despite strong
    cross-locus accuracy -- the across-individual vs across-gene distinction is
    the single most important caveat to communicate to anyone picking it up.
    Replicate checkpoints and the many community ports are deliberately not
    separate entities; see model:flashzoi for one that is.
  tags: [deepmind, long-range, variant-effect, enhancer-promoter]
  fate_axis: [where]
  organism: [human, mouse]
  assay: [CAGE, DNase-seq, ATAC-seq, ChIP-seq]
  task: [coverage-prediction, variant-effect-prediction, enhancer-promoter-linking]
  status: active
  curator: JimYuhaoWu
  date_added: 2026-10-16
  model_ext:
    evidence_tier: externally-benchmarked
    availability_tier: open-source
    model_family: interval-model
    architecture: [cnn, transformer]
    input_type: genomic-interval
    input_context_bp: 196608
    output_type: [coverage-track, variant-effect]
    output_resolution_bp: 128
    n_parameters_min: null      # FLAG: not stated in the abstract; unverified
    n_parameters_max: null
    genome_build: [hg38, mm10]
    license: Apache-2.0
  links:
    - kind: code
      url: https://github.com/google-deepmind/deepmind-research/tree/master/enformer
  papers:
