- entity_id: model:evo2
  type: model
  name: Evo 2
  aliases: [evo2, Evo-2]
  year: 2025
  description: >
    Genome language model trained on 3 trillion DNA base pairs spanning all
    domains of life, with 7B and 40B parameter variants, a 1 million token
    context window at single-nucleotide resolution, and both variant-effect
    scoring and genome design applications.
  notes: >
    Trained across all domains of life rather than one clade, so `organism`
    carries the local term `multi-species` -- no single NCBITaxon node says
    this without claiming a specific clade. Two parameter variants ship
    together as one release, carried as the 7B-40B range rather than collapsed
    to a single figure.
  tags: [arc-institute, striped-hyena, long-context, generative, all-domains]
  fate_axis: [how]
  organism: [multi-species, human]
  task: [representation-learning, variant-effect-prediction, sequence-generation]
  status: active
  curator: JimYuhaoWu
  date_added: 2026-10-16
  model_ext:
    evidence_tier: externally-benchmarked
    availability_tier: open-source
