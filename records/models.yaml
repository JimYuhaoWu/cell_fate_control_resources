# records/models.yaml
#
# Human-curated source of truth for `type: model` entities.
#
# Conventions:
#   * entity_id prefix MUST equal `type` (QC enforces it), so models are
#     `model:<slug>`.
#   * `evidence_tier` below is the curator's CLAIM. 05_validate.py recomputes it
#     from entity_paper roles + author overlap and reports disagreements; the
#     derivation is authoritative (schema §3.1).
#   * Replicate checkpoints of one model are ONE entity. A re-implementation
#     under its own name is a separate entity with `variant_of` set. A successor
#     with its own paper is a separate entity with `supersedes` set.
#   * `status` describes this entity only. Borzoi claiming to supersede Enformer
#     does not make Enformer `superseded` -- succession is a claim made by the
#     follower, not a fact about the precedent, and Enformer remains actively
#     used and maintained.
#   * Fields that could not be verified against an API are null and listed in
#     reports/seed_flags.md. Nothing here is written from memory.

- entity_id: model:enformer
  type: model
  name: Enformer
  aliases: [enformer]
  year: 2021
  description: >
    Predicts gene expression and chromatin tracks from DNA sequence by combining
    dilated convolutions with transformer blocks, integrating regulatory
    information from up to 100 kb away. Established the long-context interval
    model as the dominant architecture for sequence-to-function prediction.
  notes: >
    The reference point the whole interval-model literature argues with. Two
    independent Nature Genetics analyses (Tang/Toneyan/Koo and Huang et al.)
    found it explains personal transcriptome variation poorly despite strong
    cross-locus accuracy -- the across-individual vs across-gene distinction is
    the single most important caveat to communicate to anyone picking it up.
    Replicate checkpoints and the many community ports are deliberately not
    separate entities; see model:flashzoi for one that is.
  tags: [deepmind, long-range, variant-effect, enhancer-promoter]
  fate_axis: [where]
  organism: [human, mouse]
  assay: [CAGE, DNase-seq, ATAC-seq, ChIP-seq]
  task: [coverage-prediction, variant-effect-prediction, enhancer-promoter-linking]
  status: active
  curator: JimYuhaoWu
  model_ext:
    evidence_tier: externally-benchmarked
    availability_tier: open-source
    model_family: interval-model
    architecture: [cnn, transformer]
    input_type: genomic-interval
    input_context_bp: 196608
    output_type: [coverage-track, variant-effect]
    output_resolution_bp: 128
    n_parameters_min: null      # FLAG: not stated in the abstract; unverified
    n_parameters_max: null
    genome_build: [hg38, mm10]
    license: Apache-2.0
  links:
    - kind: code
      url: https://github.com/google-deepmind/deepmind-research/tree/master/enformer
  papers:
    - paper_id: 10.1038/s41592-021-01252-x
      role: primary
    - paper_id: 10.1101/2021.04.07.438649
      role: preprint
    - paper_id: 10.1038/s41588-023-01517-5
      role: critique
      note: >
        Across-individual generalization; aggregate accuracy driven by
        across-gene variation rather than personal variation.
    - paper_id: 10.1038/s41588-023-01574-w
      role: critique
      note: Personal transcriptome variation poorly explained.
    - paper_id: 10.64898/2026.02.04.703796
      role: benchmark
      note: Fine-mapping reproducibility vs GTEx/TOPMed/MAGE.

- entity_id: model:borzoi
  type: model
  name: Borzoi
  aliases: [borzoi]
  year: 2023
  description: >
    Predicts cell-type- and tissue-specific RNA-seq coverage from DNA sequence
    over a 524 kb context, scoring variant effects across transcription,
    splicing and polyadenylation from the one model. Successor to Enformer with
    finer output resolution and RNA-seq heads.
  notes: >
    `year: 2023` is the first public release (bioRxiv); the Nature Genetics
    paper carries a 2025 issue year. Trained with the Baskerville framework
    rather than the Enformer codebase, so the two are not drop-in comparable
    despite the lineage.
  tags: [calico, unet, rna-seq, eqtl-prioritization, splicing]
  fate_axis: [where]
  organism: [human, mouse]
  assay: [RNA-seq, DNase-seq, ATAC-seq, ChIP-seq, CAGE]
  task: [coverage-prediction, variant-effect-prediction, splicing-prediction,
         polyadenylation-prediction]
  status: active
  supersedes: model:enformer
  curator: JimYuhaoWu
  model_ext:
    evidence_tier: externally-benchmarked
    availability_tier: open-source
    model_family: interval-model
    architecture: [cnn, transformer]
    input_type: genomic-interval
    input_context_bp: 524288
    output_type: [coverage-track, variant-effect]
    output_resolution_bp: 32
    n_parameters_min: null      # FLAG: schema §9 asserts 235M; unverified
    n_parameters_max: null
    genome_build: [hg38, mm10]
    training_data: [Genentech/borzoi-data]
    license: Apache-2.0
  links:
    - kind: code
      url: https://github.com/calico/borzoi
    - kind: code
      url: https://github.com/calico/baskerville
      label: Baskerville training framework
    - kind: dataset
      url: https://huggingface.co/datasets/Genentech/borzoi-data
      label: training/validation/test intervals
  papers:
    - paper_id: 10.1038/s41588-024-02053-6
      role: primary
    - paper_id: 10.1101/2023.08.30.555582
      role: preprint
    - paper_id: 10.1093/bioinformatics/btaf467
      role: extension
      note: Flashzoi -- see model:flashzoi
    - paper_id: 10.64898/2026.02.04.703796
      role: benchmark
      note: Fine-mapping reproducibility vs GTEx/TOPMed/MAGE.

- entity_id: model:flashzoi
  type: model
  name: Flashzoi
  aliases: [flashzoi, borzoi-pytorch]
  year: 2024
  description: >
    Re-implementation of Borzoi substituting rotary positional encodings and
    FlashAttention-2 for relative positional encodings, giving over 3-fold
    faster training and inference and up to 2.4-fold lower memory use while
    maintaining or improving accuracy.
  notes: >
    A port under its own name, so a separate entity with `variant_of` rather
    than a Borzoi link -- the granularity rule's worked case. Weights for all
    four Flashzoi and Borzoi replicates are published together under MIT; the
    replicates are one entity, not four. Licensed more permissively than Borzoi
    itself, which matters for downstream reuse.
  tags: [flash-attention, rotary-embedding, efficiency, gagneur]
  fate_axis: [where]
  organism: [human, mouse]
  assay: [RNA-seq, DNase-seq, ATAC-seq, ChIP-seq, CAGE]
  task: [coverage-prediction, variant-effect-prediction, enhancer-promoter-linking]
  status: active
  variant_of: model:borzoi
  curator: JimYuhaoWu
  model_ext:
    evidence_tier: self-reported
    availability_tier: open-source
    model_family: interval-model
    architecture: [cnn, transformer]
    input_type: genomic-interval
    input_context_bp: 524288
    output_type: [coverage-track, variant-effect]
    output_resolution_bp: 32
    n_parameters_min: null      # FLAG: not stated in the abstract; unverified
    n_parameters_max: null
    genome_build: [hg38, mm10]
    license: MIT
  links:
    - kind: code
      url: https://github.com/johahi/borzoi-pytorch
    - kind: weights
      url: https://huggingface.co/johahi
      label: Flashzoi and Borzoi replicate weights (MIT)
    - kind: container
      url: https://zenodo.org/records/15669913
      label: archived code release
  papers:
    - paper_id: 10.1093/bioinformatics/btaf467
      role: primary
    - paper_id: 10.1101/2024.12.18.629121
      role: preprint

- entity_id: model:alphagenome
  type: model
  name: AlphaGenome
  aliases: [alphagenome]
  year: 2025
  description: >
    Unified DNA sequence model taking 1 Mb of input and predicting thousands of
    functional genomic tracks at base resolution across multiple modalities,
    covering regulatory variant effect prediction in one model rather than a
    per-assay family.
  notes: >
    The only api-only entry in the seed, and the reason that tier exists: there
    are no weights to download and no license to read, so reproducibility and
    long-term availability rest on Google continuing to serve the endpoint.
    Independently evaluated for fine-mapping reproducibility by Sweeney & Kang
    alongside Borzoi, Enformer and Sei.
  tags: [deepmind, multimodal, base-resolution, api]
  fate_axis: [where]
  organism: [human, mouse]
  assay: [RNA-seq, ATAC-seq, DNase-seq, ChIP-seq, CAGE]
  task: [coverage-prediction, variant-effect-prediction, splicing-prediction,
         chromatin-accessibility-prediction]
  status: active
  curator: JimYuhaoWu
  model_ext:
    evidence_tier: externally-benchmarked
    availability_tier: api-only
    model_family: interval-model
    architecture: [cnn, transformer]
    input_type: genomic-interval
    input_context_bp: 1000000
    output_type: [coverage-track, variant-effect]
    output_resolution_bp: 1
    n_parameters_min: null      # FLAG: not disclosed
    n_parameters_max: null
    genome_build: [hg38, mm10]
    license: null               # FLAG: API terms of use, not an SPDX license
  links:
    - kind: api
      url: https://deepmind.google.com/science/alphagenome
      label: AlphaGenome API
  papers:
    - paper_id: 10.1038/s41586-025-10014-0
      role: primary
    - paper_id: 10.1101/2025.06.25.661532
      role: preprint
    - paper_id: 10.64898/2026.02.04.703796
      role: benchmark
      note: Fine-mapping reproducibility vs GTEx/TOPMed/MAGE.

- entity_id: model:nucleotide-transformer
  type: model
  name: Nucleotide Transformer
  aliases: [NT, nucleotide-transformer, SegmentNT]
  year: 2023
  description: >
    Family of transformer DNA language models pretrained on human and
    multi-species genomes, released as a set of checkpoints from 50M to 2.5B
    parameters and evaluated by probing on downstream regulatory tasks.
  notes: >
    The `open-weights` case, and the reason that tier is distinct from
    `open-source`: inference code is on GitHub, but the published checkpoints
    carry CC-BY-NC-SA-4.0, which forbids commercial use and imposes share-alike
    on derivatives. Anyone building a product on this needs to read the license
    before the paper. Checkpoint sizes span two orders of magnitude, which is
    what `n_parameters_min`/`_max` exist to carry: the entity is the family,
    not one checkpoint, so filtering on size means filtering on the range.
  tags: [instadeep, foundation-model, probing, non-commercial-license]
  fate_axis: [how]
  organism: [human, multi-species]
  assay: [ATAC-seq, DNase-seq, ChIP-seq]
  task: [representation-learning, chromatin-accessibility-prediction,
         histone-modification-prediction, splicing-prediction]
  status: active
  curator: JimYuhaoWu
  model_ext:
    evidence_tier: externally-benchmarked
    availability_tier: open-weights
    model_family: dna-lm
    architecture: [transformer]
    input_type: sequence
    input_context_bp: 12288
    output_type: [embedding, scalar]
    output_resolution_bp: null
    n_parameters_min: 50000000      # verified: "from 50 million up to 2.5 billion"
    n_parameters_max: 2500000000
    genome_build: [hg38]
    license: CC-BY-NC-SA-4.0
  links:
    - kind: code
      url: https://github.com/instadeepai/nucleotide-transformer
    - kind: weights
      url: https://huggingface.co/InstaDeepAI
      label: checkpoint collection (CC-BY-NC-SA-4.0)
  papers:
    - paper_id: 10.1038/s41592-024-02523-z
      role: primary
    - paper_id: 10.1101/2023.01.11.523679
      role: preprint
    - paper_id: arxiv:2311.12570
      role: benchmark
      note: BEND -- biologically meaningful genome annotation tasks.
    - paper_id: 10.52202/079017-1981
      role: benchmark
      note: DART-Eval -- regulatory DNA, zero-shot/probed/fine-tuned vs ab initio.

- entity_id: model:evo2
  type: model
  name: Evo 2
  aliases: [evo2, Evo-2]
  year: 2025
  description: >
    Genome language model trained on 3 trillion DNA base pairs spanning all
    domains of life, with 7B and 40B parameter variants, a 1 million token
    context window at single-nucleotide resolution, and both variant-effect
    scoring and genome design applications.
  notes: >
    Trained across all domains of life rather than one clade, so `organism`
    carries the local term `multi-species` -- no single NCBITaxon node says
    this without claiming a specific clade. Two parameter variants ship
    together as one release, carried as the 7B-40B range rather than collapsed
    to a single figure.
  tags: [arc-institute, striped-hyena, long-context, generative, all-domains]
  fate_axis: [how]
  organism: [multi-species, human]
  task: [representation-learning, variant-effect-prediction, sequence-generation]
  status: active
  curator: JimYuhaoWu
  model_ext:
    evidence_tier: self-reported
    availability_tier: open-source
    model_family: dna-lm
    architecture: [ssm, transformer]
    input_type: sequence
    input_context_bp: 1000000
    output_type: [embedding, sequence, variant-effect]
    output_resolution_bp: 1
    n_parameters_min: 7000000000    # verified: "7B and 40B parameters"
    n_parameters_max: 40000000000
    license: Apache-2.0
  links:
    - kind: code
      url: https://github.com/ArcInstitute/evo2
  papers:
    - paper_id: 10.1101/2025.02.18.638918
      role: primary

- entity_id: model:chrombpnet
  type: model
  name: ChromBPNet
  aliases: [chrombpnet]
  year: 2024
  description: >
    Base-resolution model of chromatin accessibility profiles that factorizes
    out assay-specific enzyme bias, letting learned cis-regulatory sequence
    syntax and TF motif contributions be read off the prediction directly.
  notes: >
    Narrow input window compared with the Enformer/Borzoi line -- it models
    local accessibility syntax rather than long-range regulation, which is why
    it answers a different `where` question despite sharing the axis.
    Evaluated as an ab initio baseline in DART-Eval, whose author list overlaps
    with this one through Kundaje, so the derivation should land it at
    `partially-independent` rather than `externally-benchmarked`.
  tags: [kundaje, bias-correction, base-resolution, motif-syntax]
  fate_axis: [where]
  organism: [human, mouse]
  cell_type: [K562]
  assay: [ATAC-seq, DNase-seq]
  task: [chromatin-accessibility-prediction, motif-discovery,
         variant-effect-prediction, tf-binding-prediction]
  status: active
  curator: JimYuhaoWu
  model_ext:
    evidence_tier: partially-independent
    availability_tier: open-source
    model_family: interval-model
    architecture: [cnn]
    input_type: genomic-interval
    input_context_bp: 2114
    output_type: [coverage-track, variant-effect]
    output_resolution_bp: 1
    n_parameters_min: null      # FLAG: not stated in the abstract
    n_parameters_max: null
    genome_build: [hg38, mm10]
    license: MIT
  links:
    - kind: code
      url: https://github.com/kundajelab/chrombpnet
  papers:
    - paper_id: 10.1101/2024.12.25.630221
      role: primary
    - paper_id: 10.52202/079017-1981
      role: benchmark
      note: >
        DART-Eval, as an ab initio baseline. Shares an author (Kundaje) with
        the primary paper -- the partially-independent case.

- entity_id: model:gears
  type: model
  name: GEARS
  aliases: [gears]
  year: 2022
  description: >
    Graph neural network predicting transcriptional outcomes of multigene
    perturbations, including combinations never seen in training, by combining
    a gene co-expression graph with a knowledge graph of gene ontology
    relations.
  notes: >
    Deliberately shallow. Perturbation modelling is covered properly by the
    Stegle group's living catalogue (>152 methods, Nat Rev Genet 2026) and CFCR
    points outward rather than competing -- see the `website` link. GEARS is
    here as the representative entry so the `what` axis is not empty, not as
    the start of a perturbation index.
    `architecture` required a new vocabulary term: GNN is absent from the
    schema §3.1 enum, and it is the dominant architecture on this axis.
  tags: [perturbation, gnn, combinatorial, leskovec, shallow-by-design]
  fate_axis: [what]
  organism: [human]
  cell_type: [K562]
  assay: [Perturb-seq]
  task: [perturbation-response-prediction]
  status: active
  curator: JimYuhaoWu
  model_ext:
    evidence_tier: self-reported
    availability_tier: open-source
    model_family: perturbation-model
    architecture: [gnn]
    input_type: expression-matrix
    output_type: [cell-state]
    n_parameters_min: null      # FLAG: not stated in the abstract
    n_parameters_max: null
    license: null               # FLAG: no LICENSE file found in the repository
  links:
    - kind: code
      url: https://github.com/snap-stanford/GEARS
    - kind: website
      url: https://interp-extrap-perturb.readthedocs.io
      label: Stegle group perturbation-method catalogue (authoritative for this axis)
  papers:
    - paper_id: 10.1038/s41587-023-01905-6
      role: primary
    - paper_id: 10.1101/2022.07.12.499735
      role: preprint
    - paper_id: 10.1038/s41576-025-00920-4
      role: review
      note: Nat Rev Genet perturbation-modelling catalogue and ontology.
