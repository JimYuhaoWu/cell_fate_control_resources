  description: >
    Base-resolution model of chromatin accessibility profiles that factorizes
    out assay-specific enzyme bias, letting learned cis-regulatory sequence
    syntax and TF motif contributions be read off the prediction directly.
  notes: >
    Narrow input window compared with the Enformer/Borzoi line -- it models
    local accessibility syntax rather than long-range regulation, which is why
    it answers a different `where` question despite sharing the axis.
