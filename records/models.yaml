- entity_id: model:borzoi
  type: model
  name: Borzoi
  aliases: [borzoi]
  year: 2023
  description: >
    Predicts cell-type- and tissue-specific RNA-seq coverage from DNA sequence
    over a 524 kb context, scoring variant effects across transcription,
    splicing and polyadenylation from the one model. Successor to Enformer with
    finer output resolution and RNA-seq heads.
  notes: >
    `year: 2023` is the first public release (bioRxiv); the Nature Genetics
    paper carries a 2025 issue year. Trained with the Baskerville framework
    rather than the Enformer codebase, so the two are not drop-in comparable
    despite the lineage.
