    availability_tier: open-weights
    model_family: dna-lm
    architecture: [transformer]
    input_type: sequence
    input_context_bp: 12288
    output_type: [embedding, scalar]
    output_resolution_bp: null
    n_parameters_min: 50000000      # verified: "from 50 million up to 2.5 billion"
