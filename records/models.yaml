- entity_id: model:nucleotide-transformer
  type: model
  name: Nucleotide Transformer
  aliases: [NT, nucleotide-transformer, SegmentNT]
  year: 2023
  description: >
    Family of transformer DNA language models pretrained on human and
    multi-species genomes, released as a set of checkpoints from 50M to 2.5B
    parameters and evaluated by probing on downstream regulatory tasks.
  notes: >
    The `open-weights` case, and the reason that tier is distinct from
    `open-source`: inference code is on GitHub, but the published checkpoints
    carry CC-BY-NC-SA-4.0, which forbids commercial use and imposes share-alike
    on derivatives. Anyone building a product on this needs to read the license
    before the paper. Checkpoint sizes span two orders of magnitude, which is
    what `n_parameters_min`/`_max` exist to carry: the entity is the family,
    not one checkpoint, so filtering on size means filtering on the range.
  tags: [instadeep, foundation-model, probing, non-commercial-license]
  fate_axis: [how]
  organism: [human, multi-species]
  assay: [ATAC-seq, DNase-seq, ChIP-seq]
