- entity_id: dataset:replogle-2022-perturb-seq
  type: dataset
  name: Replogle 2022 genome-scale Perturb-seq atlas
  aliases: [Replogle Perturb-seq, genome-wide Perturb-seq]
  year: 2022
  description: >
    Genome-scale Perturb-seq screens in human cell lines, knocking down
    essentially all expressed genes and reading out single-cell transcriptomes,
    providing the reference training and evaluation data for perturbation
    response models.
  notes: >
    Catalogued on the `what` axis as the dataset that most perturbation models
    in the adjacent literature are trained or evaluated on, including
    model:gears. CFCR holds the pointer; the Stegle catalogue holds the method
    landscape.
  tags: [perturb-seq, crispri, genome-scale, reference-atlas]
  fate_axis: [what]
  organism: [human]
  cell_type: [K562]
  assay: [Perturb-seq]
  task: [perturbation-response-prediction]
  status: active
  curator: JimYuhaoWu
  date_added: 2026-10-16
  dataset_ext:
    n_records: null             # FLAG: cell count not verified from open metadata
    record_unit: cells
    modality: [perturb-seq, rna]
    accession: []               # FLAG: GEO accession not verified
    genome_build: [hg38]
    access: open
    license: null               # FLAG: not verified
  links:
