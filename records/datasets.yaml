# records/datasets.yaml
#
# Datasets are catalogued when they are the thing people actually need to
# reuse -- the exact train/val/test intervals behind a model, or a reference
# perturbation atlas. `fate_axis` is inherited from what the dataset serves
# (schema §5).

- entity_id: dataset:borzoi-data
  type: dataset
  name: Borzoi training intervals
  aliases: [Genentech/borzoi-data, borzoi-data]
  year: 2023
  description: >
    The genomic intervals and train/validation/test fold assignments used to
    train Borzoi, released as TSV for human and mouse.
  notes: >
    Catalogued separately from model:borzoi because fold assignment is what
    makes an independent evaluation comparable. Anyone benchmarking against
    Borzoi who re-splits the genome themselves is not measuring the same thing.
    Record counts are deliberately null: the source release reports 55,497 human
    and 49,369 mouse intervals, which is two numbers and one `n_records`
    column, and neither figure was confirmable from the repository metadata.
  tags: [training-data, folds, intervals, reproducibility]
  fate_axis: [where]
  organism: [human, mouse]
  assay: [RNA-seq, ATAC-seq, DNase-seq, ChIP-seq, CAGE]
  task: [coverage-prediction]
  status: active
  curator: JimYuhaoWu
  date_added: 2026-10-16
  dataset_ext:
    n_records: null             # FLAG: per-organism split; see notes
    record_unit: intervals
    modality: [rna, atac, dnase, chip, cage]
    accession: []
    genome_build: [hg38, mm10]
    access: open
    license: MIT
  links:
    - kind: dataset
      url: https://huggingface.co/datasets/Genentech/borzoi-data
  papers:
