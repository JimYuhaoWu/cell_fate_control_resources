# Publishes site/ to GitHub Pages.
#
# Classic Pages serves only the repository root or a folder named docs/, and
# docs/ here holds the schema draft — publishing
# from there would put working design documents on the web. Deploying from
# Actions lets site/ be the published root and leaves docs/ as documents.
#
# site/data/*.json is committed, so this workflow uploads rather than builds.
# It does re-run the exporter first and fail if the result differs from what is
# committed: a curation change that forgets `scripts/07_export_site.py` would
# otherwise keep serving the previous export with nothing reporting a problem.
# That check is why there is no `paths:` filter -- the staleness it catches is
# caused by commits that touch no file under site/.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -e .
      # The build and QC are run, not just the exporter. 04_build.py spent
      # three commits exiting 1 on a TypeError while every snapshot it wrote
      # was correct, and nothing noticed, because this workflow only ever ran
      # the export. Only the four data snapshots are diffed: build_manifest.json
      # carries the build date and qc_report.tsv the run's own output, so both
      # differ on any later day and would fail this for no reason.
      - name: records build and pass QC
        run: |
          python scripts/04_build.py
          python scripts/05_validate.py
          git diff --exit-code -- db/entities.tsv db/papers.tsv \
                                  db/entity_paper.tsv db/links.tsv
      - name: site/data matches the committed records
        run: |
          python scripts/07_export_site.py
          git diff --exit-code -- site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
