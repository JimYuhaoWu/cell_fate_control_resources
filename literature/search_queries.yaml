# literature/search_queries.yaml
#
# Queries sent by literature/01_search.py, one block per collection the
# backfill is organised around (ROADMAP M4). Adapted from eCR_mod_lib's file of
# the same name, with the per-source keys changed: that pipeline queried PubMed
# and Semantic Scholar, and CFCR queries Europe PMC and arXiv -- see
# config/sources.yaml for why.
#
# Every query here was run against the live APIs before being committed, so the
# syntax is known to work: Europe PMC takes TITLE_ABS, boolean AND/OR/NOT,
# SRC:PPR for preprints and FIRST_PDATE ranges; arXiv takes ti:, abs:, all:
# and cat:. Hit counts are deliberately not recorded -- they change daily.
#
# `fate_axis` and `expect_type` are triage hints, not assertions: they say what
# a hit from this query is likely to be, so 02_triage.py can rank and group.
# The curator still decides, and the decision is written into
# literature/reviews/review_YYYY-MM-DD.md.

# **What these clauses reach, and how that is known.** 2026-11-04.
# `literature/query_coverage.py` reads the cached discovery dumps and
# `records/` and reports two numbers: how many published records the clauses
# find the primary paper of, and how many *withdrawn* ones they find as well.
# Against the 2026-10-29 run the eight clauses as they then stood reached 206
# of the 249 published records carrying a primary, and returned 207 of the 239
# withdrawn ones in the same hit set. The second number is the point: a query
# reaches a literature, not a boundary, and `docs/scope_criteria.md` is what
# separates the halves. ROADMAP M4 makes the pair its exit criterion.
#
# The 43 misses were then tested one at a time, by asking Europe PMC for
# `(every clause) AND DOI:"<the paper>"`. **Not one of the 39 testable misses
# was hidden by `max_results_per_query`** -- the clause terms matched none of
# them. So the gap was vocabulary, and the widenings below are dated today and
# were each run live, per the rule above, with the records they newly reach
# named in their own comment. Projected reach afterwards is 240 of 249; the
# next cached cycle is what will confirm it, since a projection is not a
# measurement.

# Appended to every Europe PMC query. CFCR's organism scope is human, mouse and
# multi-species models (vocab/organism.yaml), but the filter is on *publication
# type*, not organism: a model trained on plant genomes is out of scope by the
# scope rule in README, and a negative organism keyword would also throw away
# the multi-species DNA language models that are squarely in scope.
europepmc_exclude: "NOT (PUB_TYPE:\"Editorial\" OR PUB_TYPE:\"Comment\")"

# arXiv categories worth searching. cs.LG is here because the `how` axis lives
# at ML venues: BEND (ICLR 2024) is a catalogued benchmark and is absent from
# Europe PMC entirely.
arxiv_categories: ["q-bio.GN", "cs.LG", "q-bio.QM"]

queries:
  # ── `where`: sequence-to-function ──────────────────────────────────────────
  # Widened 2026-11-04. The four committed phrasings described the axis as it
  # is written about now and missed almost every paper that founded it: the
  # canon says "from DNA sequence" (Akita, Borzoi), "sequence-based modeling"
  # (Orca, scBasset), "regulatory code" (Basset), "base-resolution" (BPNet,
  # ChromBPNet) and "Directly from Genomic Sequence" (Xpresso). It newly
  # reaches model:akita, model:basset, model:bpnet, model:chrombpnet,
  # model:expecto, model:orca, model:scbasset and model:xpresso -- eight
  # records on lines ROADMAP M4 ticks as done.
  #
  # 584 live hits in the date window, measured the day it was widened. Two
  # kinds of number appear in this file and they are not the same: a *live hit
  # count* is what Europe PMC says the clause matches, and a *fetched paper
  # count* is what a cycle brings back, which `max_results_per_query` bounds.
  # This clause matches 584 and the cap below now takes all of them.
  #
  # `accessibility` and `genome_3d` were widened the same way and the change
  # was reverted: the candidates they gained (ChromBPNet and scBasset; Akita
  # and Orca) are reached by this clause already, and widening genome_3d took
  # it from 103 fetched papers to 468 live hits for nothing. Measured,
  # redundant, not committed.
  - id: interval_models
    fate_axis: where
    expect_type: model
    europepmc: >
      (TITLE_ABS:"gene expression prediction" OR TITLE_ABS:"sequence-to-function"
       OR TITLE_ABS:"sequence to expression" OR TITLE_ABS:"regulatory activity prediction"
       OR TITLE_ABS:"from DNA sequence" OR TITLE_ABS:"from genomic sequence"
       OR TITLE_ABS:"sequence-based modeling" OR TITLE_ABS:"sequence-based prediction"
       OR TITLE_ABS:"regulatory code" OR TITLE_ABS:"base-resolution")
      AND (TITLE_ABS:"deep learning" OR TITLE_ABS:"neural network"
           OR TITLE_ABS:"convolutional" OR TITLE_ABS:"transformer")
    arxiv: 'abs:"gene expression prediction" AND abs:"genomic sequence"'

  # Widened 2026-11-04. The four phrasings added are how the founding papers
  # of this axis actually write it: DeepSEA says "effects of noncoding
  # variants", ExPecto and GPN say "variant effects", and the committed exact
  # phrase "variant effect prediction" matched neither. 166 live hits, all of
  # them fetched, and it newly reaches model:deepsea, model:sei, model:borzoi,
  # model:flashzoi and dataset:borzoi-data.
  - id: variant_effect
    fate_axis: where
    expect_type: model
    europepmc: >
      (TITLE_ABS:"variant effect prediction" OR TITLE_ABS:"variant effects"
       OR TITLE_ABS:"effects of noncoding variants"
       OR TITLE_ABS:"effects of non-coding variants")
      AND (TITLE_ABS:"non-coding" OR TITLE_ABS:"noncoding"
           OR TITLE_ABS:"regulatory" OR TITLE_ABS:"expression")
      AND (TITLE_ABS:"deep learning" OR TITLE_ABS:"model")
    arxiv: 'abs:"variant effect" AND abs:"regulatory"'

  - id: accessibility
    fate_axis: where
    expect_type: model
    europepmc: >
      (TITLE_ABS:"chromatin accessibility prediction" OR TITLE_ABS:"ATAC-seq prediction"
       OR TITLE_ABS:"open chromatin prediction")
      AND (TITLE_ABS:"deep learning" OR TITLE_ABS:"model" OR TITLE_ABS:"single-cell")
    arxiv: 'abs:"chromatin accessibility" AND abs:"deep learning"'

  # Admitted to scope by b9483d4; `contact-map` in vocab/output_type.yaml is
  # waiting on the first record from this query (issue #7).
  - id: genome_3d
    fate_axis: where
    expect_type: model
    europepmc: >
      (TITLE_ABS:"chromatin interaction prediction" OR TITLE_ABS:"contact map prediction"
       OR TITLE_ABS:"Hi-C prediction" OR TITLE_ABS:"3D genome prediction")
      AND (TITLE_ABS:"deep learning" OR TITLE_ABS:"sequence")
    arxiv: 'abs:"Hi-C" AND abs:"deep learning"'

  # ── `how`: DNA language models ─────────────────────────────────────────────
  # Left alone deliberately on 2026-10-21, after trying to narrow it. This is
  # the query with the worst signal-to-noise -- 74 of 96 hits score below 3.0 --
  # and none of the three obvious fixes works:
  #
  #   * Narrowing to TITLE, or adding a scope clause, drops Nucleotide
  #     Transformer out of the results. The query currently finds 2 of the 5
  #     DNA LMs it is responsible for; narrowing takes that to 1.
  #   * Widening to catch the rest (adding "sequence modeling", "genome
  #     modeling" and "foundation model" clauses) does find Evo 2 and Caduceus,
  #     but takes the query to 494 hits, where Europe PMC's relevance order puts
  #     Nucleotide Transformer at rank 76 -- past `max_results_per_query`. With
  #     cursor paging all four come back.
  #   * Even then the scoring under-ranks them: Evo 2 and GROVER score 2.00 and
  #     Nucleotide Transformer 3.50, because the `model` table is
  #     interval-model vocabulary and a DNA language model paper does not use
  #     it. Caduceus scores 9.00, so this is not uniform.
  #
  # The noise is not query breadth. Surveys, security papers and plant language
  # models legitimately use the same phrases as the models in scope, so no
  # keyword query separates them -- the scoring already does, correctly. Fixing
  # this needs paging past the result cap and a table for the `how` axis, which
  # is docs/triage_design.md §1.4's finding one level deeper.
  #
  # Widened 2026-11-04, and the reason is a phrase-matching detail worth
  # recording: Europe PMC's TITLE_ABS:"DNA language model" does **not** match
  # the plural, and GPN's title is "DNA language models are powerful predictors
  # of genome-wide variant effects" while GENA-LM's says "foundational DNA
  # language models". DNABERT writes "DNA-language" with the hyphen, Evo 2
  # "Genome modeling", EpiGePT "transformer-based language model". Five
  # additions and 379 live hits, and it newly reaches model:dnabert,
  # model:gena-lm, model:gpn, model:evo2 and model:epigept.
  - id: dna_language_models
    fate_axis: how
    expect_type: model
    europepmc: >
      (TITLE_ABS:"DNA language model" OR TITLE_ABS:"DNA language models"
       OR TITLE_ABS:"DNA-language" OR TITLE_ABS:"genomic language model"
       OR TITLE_ABS:"genome language model" OR TITLE_ABS:"nucleotide transformer"
       OR TITLE_ABS:"genomic foundation model"
       OR TITLE_ABS:"foundational DNA language" OR TITLE_ABS:"genome modeling"
       OR TITLE_ABS:"transformer-based language model")
    arxiv: 'all:"DNA language model" OR all:"genomic language model"'

  # ── `what`: shallow and pointing outward (README scope rule) ───────────────
  # A single-cell foundation model qualifies only when it predicts a
  # perturbation response, not when it only embeds cells; the
  # interp-extrap-perturb catalogue owns this axis properly.
  #
  # Widened and filtered on 2026-10-21, after measurement went the opposite way
  # to expectation. The first version asked for the exact phrase
  # "perturbation response prediction" and **did not find GEARS** -- the one
  # perturbation model in the catalogue, whose paper is titled "Predicting
  # transcriptional outcomes of novel multigene perturbations". A query that
  # misses the resource it exists for is not narrow, it is wrong. Four phrasings
  # now, and GEARS comes back.
  #
  # The NOT clause is the other half. 16 of this query's 30 below-threshold hits
  # were optimal-transport, flow-matching and trajectory papers -- the cluster
  # README puts explicitly out of scope. They were arriving and then being sunk
  # by the scoring table, which is work done twice; excluding them in the query
  # is cheaper and says the same thing. This is an exclusion by the project's
  # own stated rule, unlike an organism filter, which is why it belongs here and
  # a clade filter does not.
  #
  # Net: 37 hits -> 109, finding what it must and no longer fetching the
  # category that dominated its noise.
  - id: perturbation_response
    fate_axis: what
    expect_type: model
    europepmc: >
      (TITLE_ABS:"perturbation response prediction"
       OR TITLE_ABS:"perturbation prediction"
       OR TITLE_ABS:"predicting transcriptional outcomes"
       OR TITLE_ABS:"genetic perturbation response")
      AND (TITLE_ABS:"single-cell" OR TITLE_ABS:"transcriptional"
           OR TITLE_ABS:"CRISPR")
      NOT (TITLE_ABS:"optimal transport" OR TITLE_ABS:"flow matching"
           OR TITLE_ABS:"trajectory inference" OR TITLE_ABS:"RNA velocity"
           OR TITLE_ABS:"pseudotime" OR TITLE_ABS:"lineage tracing")
    arxiv: 'abs:"perturbation response" AND abs:"single-cell"'

  # ── Resources that serve the models ────────────────────────────────────────
  # The one query whose hits are mostly *not* new entities: a benchmark paper
  # usually evaluates models already catalogued, which is why it also feeds the
  # citation sweep below.
  #
  # Narrowed 2026-10-20 on docs/triage_design.md §1.6.2, which measured the
  # first version at 2,326 Europe PMC hits with a median score of 2.50 and
  # toxicology, breast-cancer imaging, bibliometrics and crop breeding in the
  # top 50. Two changes: "benchmark" moved from TITLE_ABS to TITLE, since every
  # methods paper benchmarks something in its abstract, and the second clause
  # now has to name something in scope instead of the bare word "model". The
  # result is 61 hits. The arXiv side is left alone on purpose -- see below.
  - id: benchmarks
    fate_axis: null
    expect_type: benchmark
    europepmc: >
      (TITLE:"benchmark" OR TITLE:"benchmarks" OR TITLE:"benchmarking"
       OR TITLE_ABS:"evaluation suite"
       OR TITLE_ABS:"systematic evaluation" OR TITLE_ABS:"head-to-head comparison")
      AND (TITLE_ABS:"genomic language model" OR TITLE_ABS:"DNA language model"
           OR TITLE_ABS:"sequence-to-function" OR TITLE_ABS:"regulatory DNA"
           OR TITLE_ABS:"chromatin accessibility"
           OR TITLE_ABS:"gene expression prediction"
           OR TITLE_ABS:"variant effect prediction"
           OR TITLE_ABS:"long-range DNA"
           OR TITLE_ABS:"genomic sequence classification")
    # The load-bearing half, and narrowed on 2026-10-28. docs/triage_design.md
    # §2.6.1 names this query as the mitigation for DART-Eval, whose OpenAlex
    # record has one reference deposited so no citation sweep can ever reach
    # it, and which is absent from Europe PMC entirely -- arXiv is the only
    # route to it. That mitigation is why this was left as
    # `ti:"benchmark" AND abs:"genomic"`, and why tightening it to the
    # DNA-language-model phrasings was rejected: DART-Eval went to rank 1 and
    # the query collapsed to 3 hits.
    #
    # Measured against literature/scope_labels.yaml, those two words were the
    # worst source in the pipeline: 48 of them became records, 43 of which are
    # out of scope -- 90%, and a quarter of every record the scope audit
    # withdrew. `abs:"genomic"` matches a passing mention, and RainNet's
    # abstract says "nuclear fusion, ecology, genomics, meteorology". AGQA,
    # MatTools, LassoBench, FACTUAL, Reefknot, Table2Vec, a phase-field
    # benchmark and an MRI benchmark all arrived this way.
    #
    # So the subject has to be named in the TITLE as well. Measured live
    # against the 56 cached hits: 56 -> 23, keeping 5 of 5 in-scope records and
    # dropping 32 of the 43 out-of-scope ones, with DART-Eval kept and now top
    # of the list, plus BEND newly reachable. Unlike the phrase-level attempt
    # this does not collapse the query, because it asks for any genomics word
    # rather than one of seven phrasings.
    #
    # `abs:"genomic"` STAYS, and dropping it was measured and rejected. Without
    # it the title terms are catastrophically ambiguous on an arXiv corpus that
    # is mostly computer science: `variant` matched "software variants" and
    # multi-agent pathfinding, `regulatory` matched FDA and PFAS law,
    # `perturbation` matched SLAM robotics and Atari saliency maps, `promoter`
    # matched entertainment content promotion. That version dropped the same 33
    # and added 40 hits, 32 of them scoring over the boundary with no substrate
    # term to veto them -- a worse trade than the query it replaced.
    #
    # One line, like every other `arxiv` query here. A folded block keeps the
    # newlines of its more-indented lines, so the wrapped version of this was
    # reaching search_arxiv with four of them embedded -- harmless for the
    # europepmc queries, which all carry some, and untested for arXiv.
    arxiv: 'ti:"benchmark" AND abs:"genomic" AND (ti:"genomic" OR ti:"genome" OR ti:"DNA" OR ti:"chromatin" OR ti:"regulatory" OR ti:"enhancer" OR ti:"promoter" OR ti:"variant" OR ti:"nucleotide" OR ti:"gene expression" OR ti:"perturbation" OR ti:"epigenomic" OR ti:"transcriptomic" OR ti:"sequence-to-function")'

  - id: module_collections
    fate_axis: with-what
    expect_type: module
    europepmc: >
      (TITLE_ABS:"effector domain" OR TITLE_ABS:"activation domain"
       OR TITLE_ABS:"repression domain" OR TITLE_ABS:"chromatin regulator")
      AND (TITLE_ABS:"high-throughput" OR TITLE_ABS:"screen" OR TITLE_ABS:"tiling"
           OR TITLE_ABS:"compendium")
    arxiv: null

  # ── Resources CFCR holds and never asked for ─────────────────────────
  # Added 2026-11-04. Until today no clause asked for a database, a dataset or
  # a protocol, so all 7 published databases, 8 of 9 datasets and all 4
  # protocols were unreachable by query -- every one of them entered by hand
  # through 05_backfill.py. triage_rules.py has had a scoring table for each of
  # the three types since it was written (`DATABASE_TERMS`, `DATASET_TERMS`,
  # `PROTOCOL_TERMS`, keyed in `TABLES`), and not one of them has ever received
  # a candidate. These four clauses are what exercise them.
  #
  # `arxiv: null` on all four, like `module_collections`: a motif database, a
  # reference epigenome and a wet-lab protocol are not deposited on arXiv, and
  # the categories in `arxiv_categories` hold models and benchmarks.
  - id: motif_databases
    fate_axis: null
    expect_type: database
    # 790 hits. Reaches database:jaspar-2024, database:remap-2022,
    # database:hocomoco-v12, database:ensembl-regulatory-build and
    # database:kipoi. The second group is TITLE-anchored for the reason the
    # `benchmarks` query is: "transcription factors" in an abstract is a
    # passing mention in half of molecular biology, while a title calling
    # itself a database, a registry or a rebuild is making a claim about what
    # the paper ships. database:cis-bp is still unreachable -- its paper is
    # 2014, before `min_year`.
    europepmc: >
      (TITLE_ABS:"transcription factor binding" OR TITLE_ABS:"transcription factors"
       OR TITLE_ABS:"binding models" OR TITLE_ABS:"regulatory element"
       OR TITLE_ABS:"cis-regulatory" OR TITLE_ABS:"regulatory build"
       OR TITLE_ABS:"model zoo" OR TITLE_ABS:"models for genomics")
      AND (TITLE:"database" OR TITLE:"atlas" OR TITLE:"catalogue"
           OR TITLE:"catalog" OR TITLE:"registry" OR TITLE:"collection"
           OR TITLE:"resource" OR TITLE:"encyclopedia" OR TITLE:"repository"
           OR TITLE:"build" OR TITLE:"rebuild")
    arxiv: null

  - id: reference_epigenomes
    fate_axis: null
    expect_type: dataset
    # 135 hits, the narrowest of the four. Reaches
    # database:encode-screen-ccres and dataset:roadmap-epigenomics.
    # "reference human epigenomes" is listed beside "reference epigenome"
    # because Roadmap's title interposes the species and Europe PMC matches the
    # phrase, not the words. dataset:encode matches too but is a 2012 paper, so
    # the date window excludes it: the 2015 floor is deliberate (see below) and
    # this is what it costs.
    europepmc: >
      (TITLE_ABS:"reference epigenome" OR TITLE_ABS:"reference human epigenomes"
       OR TITLE_ABS:"encyclopedia of DNA elements"
       OR TITLE_ABS:"candidate cis-regulatory element")
      AND (TITLE_ABS:"integrative" OR TITLE_ABS:"human" OR TITLE_ABS:"registry"
           OR TITLE_ABS:"expanded")
    arxiv: null

  - id: perturbation_atlases
    fate_axis: null
    expect_type: dataset
    # 256 hits, and the cleanest result of the four: it reaches all five
    # Perturb-seq and chemical-transcriptomics datasets the catalogue holds --
    # dataset:adamson-2016-perturb-seq-upr-screen, dataset:dixit-2016-perturb-seq,
    # dataset:norman-2019-combinatorial-perturb-seq,
    # dataset:replogle-2022-perturb-seq and dataset:sci-plex. These are the
    # training sets the `what` axis rests on, so a cycle that proposes one is
    # proposing the ground truth for a perturbation model, not a model.
    europepmc: >
      (TITLE_ABS:"Perturb-seq" OR TITLE_ABS:"single-cell CRISPR screen"
       OR TITLE_ABS:"CRISPR interference screen"
       OR TITLE_ABS:"chemical transcriptomics")
      AND (TITLE_ABS:"single-cell" OR TITLE_ABS:"transcriptomic"
           OR TITLE_ABS:"atlas")
    arxiv: null

  - id: chromatin_protocols
    fate_axis: with-what
    expect_type: protocol
    # 440 hits. Reaches protocol:cut-tag and protocol:omni-atac.
    # protocol:atac-seq matches as well but is Buenrostro 2013, outside the
    # date window, like dataset:encode above. The assay names carry the query
    # and the second group asks what kind of paper it is, because "ATAC-seq" in
    # an abstract is usually a method someone used rather than the protocol
    # being published -- which is exactly what PROTOCOL_TERMS then scores.
    europepmc: >
      (TITLE_ABS:"ATAC-seq" OR TITLE_ABS:"CUT&Tag" OR TITLE_ABS:"CUT&RUN"
       OR TITLE_ABS:"DNase-seq")
      AND (TITLE:"protocol" OR TITLE:"method"
           OR TITLE_ABS:"transposition of native chromatin"
           OR TITLE_ABS:"efficient epigenomic profiling" OR TITLE_ABS:"improved"
           OR TITLE_ABS:"fast and sensitive")
    arxiv: null

# How the `benchmark` and `critique` roles are actually found.
#
# This is not a query, and that is the point: no keyword search finds a paper
# that criticises a model. Asked for papers matching "fail" and "enformer",
# Europe PMC returns three hits, none of them either of the two critiques of
# Enformer already catalogued here. They are reached by walking the citations
# of the primary paper and judging which citing papers are evaluations --
# OpenAlex supplies the edges, a human supplies the judgement.
citation_sweep:
  source: openalex
  # Entities whose primary paper gets swept. `all` means every entity with a
  # `primary` paper; the sweep is the expensive step, so a cycle may narrow it.
  entities: all
  # A paper citing the primary is a candidate for `benchmark` or `critique`.
  # evidence_tier is then derived by 05_validate.py from author overlap, never
  # from anything decided here -- triage proposes the role, QC decides the tier.
  candidate_roles: ["benchmark", "critique"]

# Shared limits.
#
# min_year is 2015 rather than the field's recent boom: DeepSEA (2015) and the
# Basenji line that M4 names are the start of the `where` axis, and a later cut
# would silently amputate the lineage that `supersedes` and `variant_of` link.
min_year: 2015
# Raised from 50 on 2026-10-21, because 50 was losing the resources the queries
# exist to find. Measured: the widened `perturbation_response` query returns
# GEARS -- the only perturbation model in the catalogue -- at rank 89 of 109 in
# Europe PMC's relevance order, and `dna_language_models` puts Nucleotide
# Transformer at rank 76. Both fell off the end. 100 is Europe PMC's own page
# size, so it was one request either way.
#
# The cost is rows, not requests: a broader fetch means more low-scoring
# candidates in the review file's below-threshold section. That is the right
# trade only because scoring, not the API's relevance order, decides what a
# curator reads -- see docs/triage_design.md §1.5.
#
# Raised again to 300 on 2026-10-29, and this time the cap was the binding
# constraint rather than the rank. docs/triage_design.md 1.8 measured 298
# Europe PMC hits sitting past 100, 287 of them on `interval_models` (264 hits,
# `where`) and `dna_language_models` (223, `how`) -- the two axes below their
# ranges in ROADMAP. The other five Europe PMC queries fit under 100 and are
# unaffected. 300 clears the largest of the eight with room, and
# `search_europepmc` now pages with `cursorMark` to reach it, so the cost is
# three requests for those two queries and one for everything else.
#
# arXiv is left at the same cap and does not page: its largest query is 58 hits
# and none is near 100, so there is nothing past the end to reach.
#
# Raised to 800 on 2026-11-04, and this time the evidence is a regression
# rather than a shortfall. The widenings above took `interval_models` to 584
# live hits, `dna_language_models` to 379, `motif_databases` to 790 and
# `chromatin_protocols` to 440, so four of the twelve clauses hit the 300 cap
# -- and the first cycle on them reached 225 of 249 published records where the
# per-DOI probes said 240. The 15 missing are not misses, they are
# displacements: `model:enformer` and `model:basenji` were reached by the
# narrower clause on 2026-10-29 and fell out of the top 300 once the clause
# admitted more papers. A wider query with a fixed cap can lose records it used
# to find, which is the one failure mode that makes reach look like a tuning
# problem when it is a paging problem.
#
# 800 clears the largest clause (790) with room. The cost is paging: 8 requests
# for `motif_databases`, 6 for `interval_models`, 5 for `chromatin_protocols`,
# 4 for `dna_language_models` and 1 each for the other eight, so about 31
# Europe PMC requests for a full cycle against 12 before.
max_results_per_query: 800

# Breadth as measured on 2026-10-20, Europe PMC / arXiv, so the first cycle
# starts from numbers rather than guesses:
#
#   interval_models 264/1 · variant_effect 39/6 · accessibility 15/1
#   genome_3d 69/2 · dna_language_models 213/58 · perturbation_response 37/33
#   benchmarks 2326/60 · module_collections 249/-
#
# Two of these are wrong and left wrong on purpose, because the right fix
# depends on 02_triage.py's scoring, which does not exist yet:
#   - `benchmarks` is far too broad. "benchmark" is a word every methods paper
#     uses, and at 2,326 hits a 50-result cap samples noise rather than the
#     head. Narrow it, or let the citation sweep carry this role instead.
#   - `accessibility` and the tighter arXiv phrases may be too narrow -- 15
#     hits for a subfield M4 budgets ~30 entities to is suspicious.
