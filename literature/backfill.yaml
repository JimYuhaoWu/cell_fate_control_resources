  fate_axis: [where]
  paper: 10.1038/s41592-022-01562-8

- name: EpiGePT
  type: model
  fate_axis: [where]
  paper: 10.1186/s13059-024-03449-7

- name: HyenaDNA
  type: model
  fate_axis: [how]
  paper: arxiv:2306.15794

- name: GENA-LM
  type: model
  fate_axis: [how]
  paper: 10.1093/nar/gkae1310

- name: DNALongBench
  type: benchmark
