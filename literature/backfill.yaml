# Resources ROADMAP.md M4 names, that the discovery queries did not surface.
#
# Of the ~25 resources M4 lists by name, a search over 675 candidates found
# only six. These are the rest: canonical, heavily cited, and invisible to a
# keyword query because the queries look for the language of new work.
#
# `name`, `type` and `fate_axis` are curation calls and are written here.
# `paper` is a DOI, an `arxiv:` id, or a title -- a title has to come back
# matching, so a wrong one is reported rather than admitted.

