- paper_id: "10.1038/s41588-023-01574-w"
  doi: "10.1038/s41588-023-01574-w"
  title: >-
    Personal transcriptome variation is poorly explained by current genomic deep
    learning models
  authors:
    - "Connie Huang"
    - "Richard W. Shuai"
    - "Parth Baokar"
    - "Ryan Chung"
    - "Ruchir Rastogi"
    - "Pooja Kathail"
    - "Nilah M. Ioannidis"
  year: 2023
  venue: "Nature Genetics"
  venue_type: "journal"
  abstract: >-
    Genomic deep learning models can predict genome-wide epigenetic features and
    gene expression levels directly from DNA sequence. While current models
    perform well at predicting gene expression levels across genes in different
    cell types from the reference genome, their ability to explain expression
    variation between individuals due to cis -regulatory genetic variants
    remains largely unexplored. Here, we evaluate four state-of-the-art models
    on paired personal genome and transcriptome data and find limited
    performance when explaining variation in expression across individuals. In
    addition, models often fail to predict the correct direction of effect of
    cis -regulatory genetic variation on expression.
  url: "https://doi.org/10.1038/s41588-023-01574-w"
  preprint_of: null
  metadata_source: "crossref"

