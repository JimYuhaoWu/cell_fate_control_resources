- paper_id: "10.1038/s41587-023-01905-6"
  doi: "10.1038/s41587-023-01905-6"
  title: "Predicting transcriptional outcomes of novel multigene perturbations with GEARS"
  authors:
    - "Yusuf Roohani"
    - "Kexin Huang"
    - "Jure Leskovec"
  year: 2023
  venue: "Nature Biotechnology"
  venue_type: "journal"
  abstract: >-
    Understanding cellular responses to genetic perturbation is central to
    numerous biomedical applications, from identifying genetic interactions
    involved in cancer to developing methods for regenerative medicine. However,
    the combinatorial explosion in the number of possible multigene
    perturbations severely limits experimental interrogation. Here, we present
    graph-enhanced gene activation and repression simulator (GEARS), a method
    that integrates deep learning with a knowledge graph of gene–gene
    relationships to predict transcriptional responses to both single and
    multigene perturbations using single-cell RNA-sequencing data from
    perturbational screens. GEARS is able to predict outcomes of perturbing
    combinations consisting of genes that were never experimentally perturbed.
    GEARS exhibited 40% higher precision than existing approaches in predicting
    four distinct genetic interaction subtypes in a combinatorial perturbation
    screen and identified the strongest interactions twice as well as prior
    approaches. Overall, GEARS can predict phenotypically distinct effects of
    multigene perturbations and thus guide the design of perturbational
    experiments.
  url: "https://doi.org/10.1038/s41587-023-01905-6"
  preprint_of: null
  metadata_source: "crossref"
  date_added: 2026-10-16

- paper_id: "10.1101/2022.07.12.499735"
  doi: "10.1101/2022.07.12.499735"
  title: "GEARS: Predicting transcriptional outcomes of novel multi-gene perturbations"
  authors:
    - "Yusuf Roohani"
    - "Kexin Huang"
    - "Jure Leskovec"
  year: 2022
  venue: "preprint"
  venue_type: "preprint"
  abstract: >-
    Cellular response to genetic perturbation is central to numerous biomedical
    applications from identifying genetic interactions involved in cancer to
    methods for regenerative medicine. However, the combinatorial explosion in
    the number of possible multi-gene perturbations severely limits experimental
    interrogation. Here, we present GEARS, a method that can predict
    transcriptional response to both single and multi-gene perturbations using
    single-cell RNA-sequencing data from perturbational screens. GEARS is
    uniquely able to predict outcomes of perturbing combinations consisting of
    novel genes that were never experimentally perturbed by leveraging geometric
    deep learning and a knowledge graph of gene-gene relationships. GEARS has
    higher precision than existing approaches in predicting five distinct
    genetic interaction subtypes and can identify the strongest interactions
    more than twice as well as prior approaches. Overall, GEARS can discover
    novel phenotypic outcomes to multi-gene perturbations and can thus guide the
    design of perturbational experiments.
