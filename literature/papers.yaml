- paper_id: "arxiv:2606.04525"
  doi: null
  title: "GENEB: Why Genomic Models Are Hard to Compare"
  authors:
    - "Daria Ledneva"
    - "Mikhail Nuridinov"
    - "Denis Kuznetsov"
  year: 2026
  venue: null
  venue_type: "conference"
  abstract: >-
    Progress in genomic foundation models is difficult to assess due to
    fragmented benchmarks, incompatible evaluation protocols, and task-specific
    reporting. As a result, claims of superiority or generality across models
    are often not directly comparable. We introduce GENEB, a large-scale
    diagnostic benchmark that evaluates frozen representations from 40 genomic
    foundation models across 100 tasks spanning 13 functional categories under a
    unified probing-based protocol, including few-shot regimes. GENEB enables
    controlled comparison across model scale, architecture, tokenization, and
    pretraining data while explicitly exposing task-level trade-offs. Our
    analysis shows that aggregate leaderboards are unstable: model rankings vary
    sharply across task categories, scale provides only modest and inconsistent
    gains, and architectural and pretraining alignment frequently outweigh
    parameter count. These results highlight limitations of current evaluation
    practices and position GENEB as a reference framework for principled
    comparison and category-aware model selection in genomic machine learning.
  url: "https://arxiv.org/abs/2606.04525"
  preprint_of: null
  metadata_source: "arxiv"
  date_added: 2026-10-16

- paper_id: "10.1038/s41586-023-05906-y"
  doi: "10.1038/s41586-023-05906-y"
  title: "Large-scale mapping and mutagenesis of human transcriptional effector domains"
  authors:
    - "Nicole DelRosso"
    - "Josh Tycko"
    - "Peter Suzuki"
    - "Cecelia Andrews"
    - "Aradhana"
    - "Adi Mukund"
    - "Ivan Liongson"
    - "Connor Ludwig"
    - "Kaitlyn Spees"
    - "Polly Fordyce"
    - "Michael C. Bassik"
    - "Lacramioara Bintu"
  year: 2023
  venue: "Nature"
  venue_type: "journal"
  abstract: >-
    Human gene expression is regulated by more than 2,000 transcription factors
    and chromatin regulators<sup>1,2</sup>. Effector domains within these
    proteins can activate or repress transcription. However, for many of these
    regulators we do not know what type of effector domains they contain, their
    location in the protein, their activation and repression strengths, and the
    sequences that are necessary for their functions. Here, we systematically
    measure the effector activity of more than 100,000 protein fragments tiling
    across most chromatin regulators and transcription factors in human cells
    (2,047 proteins). By testing the effect they have when recruited at reporter
    genes, we annotate 374 activation domains and 715 repression domains,
    roughly 80% of which are new and have not been previously
    annotated<sup>3-5</sup>. Rational mutagenesis and deletion scans across all
    the effector domains reveal aromatic and/or leucine residues interspersed
    with acidic, proline, serine and/or glutamine residues are necessary for
    activation domain activity. Furthermore, most repression domain sequences
    contain sites for small ubiquitin-like modifier (SUMO)ylation, short
    interaction motifs for recruiting corepressors or are structured binding
    domains for recruiting other repressive proteins. We discover bifunctional
    domains that can both activate and repress, some of which dynamically split
    a cell population into high- and low-expression subpopulations. Our
    systematic annotation and characterization of effector domains provide a
    rich resource for understanding the function of human transcription factors
    and chromatin regulators, engineering compact tools for controlling gene
    expression and refining predictive models of effector domain function.
