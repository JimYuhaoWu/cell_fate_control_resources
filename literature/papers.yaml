- paper_id: "10.1093/bioinformatics/btaf467"
  doi: "10.1093/bioinformatics/btaf467"
  title: "Flashzoi: an enhanced Borzoi for accelerated genomic analysis"
  authors:
    - "Johannes C Hingerl"
    - "Alexander Karollus"
    - "Julien Gagneur"
  year: 2025
  venue: "Bioinformatics"
  venue_type: "journal"
  abstract: >-
    Motivation Accurately predicting how DNA sequence drives gene regulation and
    how genetic variants alter gene expression is a central challenge in
    genomics. Borzoi, which models over ten thousand genomic assays including
    RNA-seq coverage from over half a megabase of sequence context alone
    promises to become an important foundation model in regulatory genomics,
    both for massively annotating variants and for further model development.
    However, the currently used relative positional encodings limit Borzoi’s
    computational efficiency. Results We present Flashzoi, an enhanced Borzoi
    model that leverages rotary positional encodings and FlashAttention-2. This
    achieves over 3-fold faster training and inference and up to 2.4-fold
    reduced memory usage, while maintaining or improving accuracy in modeling
    various genomic assays including RNA-seq coverage, predicting variant
    effects, and enhancer-promoter linking. Flashzoi’s improved efficiency
    facilitates large-scale genomic analyses and opens avenues for exploring
    more complex regulatory mechanisms and modeling. Availability and
    implementation The Flashzoi model architecture is part of the MIT-licensed
    borzoi-pytorch package, can be found at https://github.com/johahi/borzoi-
    pytorch and installed via pip. Model weights for all four Flashzoi and
    Borzoi replicates are available at https://huggingface.co/johahi under the
    MIT license. The code has been archived at
    https://zenodo.org/records/15669913.
  url: "https://doi.org/10.1093/bioinformatics/btaf467"
  preprint_of: null
  metadata_source: "crossref"

- paper_id: "10.1101/2024.12.18.629121"
  doi: "10.1101/2024.12.18.629121"
  title: "Flashzoi: An enhanced Borzoi for accelerated genomic analysis"
  authors:
    - "Johannes C. Hingerl"
    - "Alexander Karollus"
    - "Julien Gagneur"
  year: 2024
  venue: "preprint"
  venue_type: "preprint"
  abstract: >-
    Accurately predicting how DNA sequence drives gene regulation and how
    genetic variants alter gene expression is a central challenge in genomics.
    Borzoi, which models over ten thousand genomic assays including RNA-seq
    coverage from over half a megabase of sequence context alone promises to
    become an important foundation model in regulatory genomics, both for
    massively annotating variants and for further model development. However,
    its reliance on handcrafted, relative positional encodings within the
    transformer architecture limits its computational efficiency. Here we
    present Flashzoi, an enhanced Borzoi model that leverages rotary positional
    encodings and FlashAttention-2. This achieves over 3-fold faster training
    and inference and up to 2.4-fold reduced memory usage, while maintaining or
    improving accuracy in modeling various genomic assays including RNA-seq
    coverage, predicting variant effects, and enhancer-promoter linking.
    Flashzoi’s improved efficiency facilitates large-scale genomic analyses and
    opens avenues for exploring more complex regulatory mechanisms and modeling.
    Availability and implementation The Flashzoi model architecture is part of
    the MIT-licensed borzoi-pytorch package, can be found at
    https://github.com/johahi/borzoi-pytorch and installed via pip. Model
    weights for all four Flashzoi and Borzoi replicates are available at
    https://huggingface.co/johahi under the MIT license.
  url: "https://doi.org/10.1101/2024.12.18.629121"
  preprint_of: "10.1093/bioinformatics/btaf467"
  metadata_source: "crossref"

