- paper_id: "10.1038/s41592-024-02523-z"
  doi: "10.1038/s41592-024-02523-z"
  title: >-
    Nucleotide Transformer: building and evaluating robust foundation models for
    human genomics
  authors:
    - "Hugo Dalla-Torre"
    - "Liam Gonzalez"
    - "Javier Mendoza-Revilla"
    - "Nicolas Lopez Carranza"
    - "Adam Henryk Grzywaczewski"
    - "Francesco Oteri"
    - "Christian Dallago"
    - "Evan Trop"
    - "Bernardo P. de Almeida"
    - "Hassan Sirelkhatim"
    - "Guillaume Richard"
    - "Marcin Skwark"
    - "Karim Beguir"
    - "Marie Lopez"
    - "Thomas Pierrot"
  year: 2024
  venue: "Nature Methods"
  venue_type: "journal"
  abstract: >-
    The prediction of molecular phenotypes from DNA sequences remains a
    longstanding challenge in genomics, often driven by limited annotated data
    and the inability to transfer learnings between tasks. Here, we present an
    extensive study of foundation models pre-trained on DNA sequences, named
    Nucleotide Transformer, ranging from 50 million up to 2.5 billion parameters
    and integrating information from 3,202 human genomes and 850 genomes from
    diverse species. These transformer models yield context-specific
    representations of nucleotide sequences, which allow for accurate
    predictions even in low-data settings. We show that the developed models can
    be fine-tuned at low cost to solve a variety of genomics applications.
    Despite no supervision, the models learned to focus attention on key genomic
    elements and can be used to improve the prioritization of genetic variants.
    The training and application of foundational models in genomics provides a
    widely applicable approach for accurate molecular phenotype prediction from
    DNA sequence.
  url: "https://doi.org/10.1038/s41592-024-02523-z"
