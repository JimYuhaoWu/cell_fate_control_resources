- paper_id: "10.64898/2026.02.04.703796"
  doi: "10.64898/2026.02.04.703796"
  title: >-
    Practical utility of sequence-to-omics models for improving the
    reproducibility of genetic fine-mapping
  authors:
    - "Michael D. Sweeney"
    - "Hyun Min Kang"
  year: 2026
  venue: "preprint"
  venue_type: "preprint"
  abstract: >-
    Recent advances in deep learning have led to the development of sequence-to-
    omics (S2O) models that predict molecular phenotypes directly from DNA
    sequences. Here, we systematically evaluate the utility of these models,
    e.g., AlphaGenome, Borzoi, Enformer, and Sei, for improving the
    reproducibility of genetic fine-mapping across expression quantitative trait
    loci (eQTL) datasets from Genotype-Tissue Expression (GTEx), Trans-Omics
    Precision Medicine (TOPMed), and Multi-Ancestry Analysis of Gene Expression
    (MAGE) projects. We show that purely statistical fine-mapping often yields
    high replication failure rates (RFRs), but integrating S2O model predictions
    substantially reduces RFRs and enhances the accuracy of prioritizing SNPs
    replicated in other consortia. We describe a generalized framework for
    functionally informed fine-mapping that combines traditional posterior
    inclusion probabilities (PIPs) from statistical fine-mapping methods with
    scores from S2O models to generate functionally informed PIPs (fiPIPs) that
    improve reproducibility. Our findings demonstrate that S2O models,
    particularly newer ones like AlphaGenome and Borzoi, enable robust
    identification of replicated variants across consortia, highlighting their
    promise for scalable, functionally aware genetic mapping.
  url: "https://doi.org/10.64898/2026.02.04.703796"
  preprint_of: null
  metadata_source: "crossref"
  date_added: 2026-10-16

- paper_id: "10.1038/s41586-025-10014-0"
  doi: "10.1038/s41586-025-10014-0"
  title: "Advancing regulatory variant effect prediction with AlphaGenome"
  authors:
    - "Žiga Avsec"
    - "Natasha Latysheva"
    - "Jun Cheng"
    - "Guido Novati"
    - "Kyle R. Taylor"
    - "Tom Ward"
    - "Clare Bycroft"
    - "Lauren Nicolaisen"
    - "Eirini Arvaniti"
    - "Joshua Pan"
    - "Raina Thomas"
    - "Vincent Dutordoir"
    - "Matteo Perino"
    - "Soham De"
    - "Alexander Karollus"
    - "Adam Gayoso"
    - "Toby Sargeant"
    - "Anne Mottram"
    - "Lai Hong Wong"
    - "Pavol Drotár"
    - "Adam Kosiorek"
    - "Andrew Senior"
    - "Richard Tanburn"
    - "Taylor Applebaum"
    - "Souradeep Basu"
    - "Demis Hassabis"
    - "Pushmeet Kohli"
  year: 2026
  venue: "Nature"
  venue_type: "journal"
  abstract: >-
    Deep learning models that predict functional genomic measurements from DNA
    sequences are powerful tools for deciphering the genetic regulatory code.
    Existing methods involve a trade-off between input sequence length and
    prediction resolution, thereby limiting their modality scope and performance
    1–5 . We present AlphaGenome, a unified DNA sequence model, which takes as
    input 1 Mb of DNA sequence and predicts thousands of functional genomic
    tracks up to single-base-pair resolution across diverse modalities. The
    modalities include gene expression, transcription initiation, chromatin
    accessibility, histone modifications, transcription factor binding,
    chromatin contact maps, splice site usage and splice junction coordinates
    and strength. Trained on human and mouse genomes, AlphaGenome matches or
    exceeds the strongest available external models in 25 of 26 evaluations of
    variant effect prediction. The ability of AlphaGenome to simultaneously
    score variant effects across all modalities accurately recapitulates the
    mechanisms of clinically relevant variants near the TAL1 oncogene 6 . To
    facilitate broader use, we provide tools for making genome track and variant
    effect predictions from sequence.
  url: "https://doi.org/10.1038/s41586-025-10014-0"
  preprint_of: null
  metadata_source: "crossref"
  date_added: 2026-10-16

