  venue_type: "preprint"
  abstract: >-
    Human gene expression is regulated by over two thousand transcription
    factors and chromatin regulators 1,2 . Effector domains within these
    proteins can activate or repress transcription. However, for many of these
    regulators we do not know what type of transcriptional effector domains they
    contain, their location in the protein, their activation and repression
    strengths, and the amino acids that are necessary for their functions. Here,
    we systematically measure the transcriptional effector activity of
    &gt;100,000 protein fragments (each 80 amino acids long) tiling across most
    chromatin regulators and transcription factors in human cells (2,047
    proteins). By testing the effect they have when recruited at reporter genes,
    we annotate 307 new activation domains and 592 new repression domains, a
    ∼5-fold increase over the number of previously annotated effectors 3,4 .
    Complementary rational mutagenesis and deletion scans across all the
    effector domains reveal aromatic and/or leucine residues interspersed with
    acidic, proline, serine, and/or glutamine residues are necessary for
    activation domain activity. Additionally, the majority of repression domain
    sequences contain either sites for SUMOylation, short interaction motifs for
    recruiting co-repressors, or are structured binding domains for recruiting
    other repressive proteins. Surprisingly, we discover bifunctional domains
    that can both activate and repress and can dynamically split a cell
    population into high- and low-expression subpopulations. Our systematic
    annotation and characterization of transcriptional effector domains provides
    a rich resource for understanding the function of human transcription
    factors and chromatin regulators, engineering compact tools for controlling
    gene expression, and refining predictive computational models of effector
    domain function.
