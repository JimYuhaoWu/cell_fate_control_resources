- paper_id: "10.1101/2024.12.25.630221"
  doi: "10.1101/2024.12.25.630221"
  title: >-
    ChromBPNet: bias factorized, base-resolution deep learning models of
    chromatin accessibility reveal cis-regulatory sequence syntax, transcription
    factor footprints and regulatory variants
  authors:
    - "Anusri Pampari"
    - "Anna Shcherbina"
    - "Evgeny Z. Kvon"
    - "Michael Kosicki"
    - "Surag Nair"
    - "Soumya Kundu"
    - "Arwa S. Kathiria"
    - "Viviana I. Risca"
    - "Kristiina Kuningas"
    - "Kaur Alasoo"
    - "William James Greenleaf"
    - "Len A. Pennacchio"
    - "Anshul Kundaje"
  year: 2024
  venue: "preprint"
  venue_type: "preprint"
  abstract: >-
    Despite extensive mapping of cis-regulatory elements (cREs) across cellular
    contexts with chromatin accessibility assays, the sequence syntax and
    genetic variants that regulate transcription factor (TF) binding and
    chromatin accessibility at context-specific cREs remain elusive. We
    introduce ChromBPNet, a deep learning DNA sequence model of base-resolution
    accessibility profiles that detects, learns and deconvolves assay-specific
    enzyme biases from regulatory sequence determinants of accessibility,
    enabling robust discovery of compact TF motif lexicons, cooperative motif
    syntax and precision footprints across assays and sequencing depths.
    Extensive benchmarks show that ChromBPNet, despite its lightweight design,
    is competitive with much larger contemporary models at predicting variant
    effects on chromatin accessibility, pioneer TF binding and reporter activity
    across assays, cell contexts and ancestry, while providing interpretation of
    disrupted regulatory syntax. ChromBPNet also helps prioritize and interpret
    regulatory variants that influence complex traits and rare diseases, thereby
    providing a powerful lens to decode regulatory DNA and genetic variation.
