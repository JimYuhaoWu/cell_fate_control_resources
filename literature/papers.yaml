- paper_id: "10.1038/s41587-024-02442-6"
  doi: "10.1038/s41587-024-02442-6"
  title: >-
    Development of compact transcriptional effectors using high-throughput
    measurements in diverse contexts
  authors:
    - "Josh Tycko"
    - "Mike V. Van"
    - "Aradhana"
    - "Nicole DelRosso"
    - "Hanrong Ye"
    - "David Yao"
    - "Raeline Valbuena"
    - "Alun Vaughan-Jackson"
    - "Xiaoshu Xu"
    - "Connor Ludwig"
    - "Kaitlyn Spees"
    - "Katherine Liu"
    - "Mingxin Gu"
    - "Venya Khare"
    - "Adi Xiyal Mukund"
    - "Peter H. Suzuki"
    - "Sophia Arana"
    - "Catherine Zhang"
    - "Peter P. Du"
    - "Thea S. Ornstein"
    - "Gaelen T. Hess"
    - "Roarke A. Kamber"
    - "Lei S. Qi"
    - "Ahmad S. Khalil"
    - "Lacramioara Bintu"
    - "Michael C. Bassik"
  year: 2024
  venue: "Nature Biotechnology"
  venue_type: "journal"
  abstract: >-
    Transcriptional effectors are protein domains known to activate or repress
    gene expression; however, a systematic understanding of which effector
    domains regulate transcription across genomic, cell type and DNA-binding
    domain (DBD) contexts is lacking. Here we develop dCas9-mediated high-
    throughput recruitment (HT-recruit), a pooled screening method for
    quantifying effector function at endogenous target genes and test effector
    function for a library containing 5,092 nuclear protein Pfam domains across
    varied contexts. We also map context dependencies of effectors drawn from
    unannotated protein regions using a larger library tiling chromatin
    regulators and transcription factors. We find that many effectors depend on
    target and DBD contexts, such as HLH domains that can act as either
    activators or repressors. To enable efficient perturbations, we select
    context-robust domains, including ZNF705 KRAB, that improve CRISPRi tools to
    silence promoters and enhancers. We engineer a compact human activator
    called NFZ, by combining NCOA3, FOXO3 and ZNF473 domains, which enables
    efficient CRISPRa with better viral delivery and inducible control of
    chimeric antigen receptor T cells.
  url: "https://doi.org/10.1038/s41587-024-02442-6"
  preprint_of: null
  metadata_source: "crossref"
  date_added: 2026-10-16

