  abstract: >-
    Accurately predicting how DNA sequence drives gene regulation and how
    genetic variants alter gene expression is a central challenge in genomics.
    Borzoi, which models over ten thousand genomic assays including RNA-seq
    coverage from over half a megabase of sequence context alone promises to
    become an important foundation model in regulatory genomics, both for
    massively annotating variants and for further model development. However,
    its reliance on handcrafted, relative positional encodings within the
    transformer architecture limits its computational efficiency. Here we
    present Flashzoi, an enhanced Borzoi model that leverages rotary positional
    encodings and FlashAttention-2. This achieves over 3-fold faster training
    and inference and up to 2.4-fold reduced memory usage, while maintaining or
    improving accuracy in modeling various genomic assays including RNA-seq
    coverage, predicting variant effects, and enhancer-promoter linking.
    Flashzoi’s improved efficiency facilitates large-scale genomic analyses and
    opens avenues for exploring more complex regulatory mechanisms and modeling.
    Availability and implementation The Flashzoi model architecture is part of
    the MIT-licensed borzoi-pytorch package, can be found at
    https://github.com/johahi/borzoi-pytorch and installed via pip. Model
    weights for all four Flashzoi and Borzoi replicates are available at
    https://huggingface.co/johahi under the MIT license.
