    - "Ilya E Vorontsov"
    - "Ivan V Kulakovskiy"
    - "Andreas Lennartsson"
    - "Finn Drabløs"
    - "Yulia A Medvedeva"
  year: 2022
  venue: "Nucleic Acids Research"
  venue_type: "journal"
  abstract: >-
    We present an update of EpiFactors, a manually curated database providing
    information about epigenetic regulators, their complexes, targets, and
    products which is openly accessible at http://epifactors.autosome.org. An
    updated version of the EpiFactors contains information on 902 proteins,
    including 101 histones and protamines, and, as a main update, a newly
    curated collection of 124 lncRNAs involved in epigenetic regulation. The
    amount of publications concerning the role of lncRNA in epigenetics is
    rapidly growing. Yet, the resource that compiles, integrates, organizes, and
    presents curated information on lncRNAs in epigenetics is missing.
    EpiFactors fills this gap and provides data on epigenetic regulators in an
    accessible and user-friendly form. For 820 of the genes in EpiFactors, we
    include expression estimates across multiple cell types assessed by CAGE-Seq
    in the FANTOM5 project. In addition, the updated EpiFactors contains
    information on 73 protein complexes involved in epigenetic regulation. Our
    resource is practical for a wide range of users, including biologists,
    bioinformaticians and molecular/systems biologists.
