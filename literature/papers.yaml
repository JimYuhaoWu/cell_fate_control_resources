- paper_id: "10.1016/j.cell.2022.05.013"
  doi: "10.1016/j.cell.2022.05.013"
  title: "Mapping information-rich genotype-phenotype landscapes with genome-scale Perturb-seq"
  authors:
    - "Joseph M. Replogle"
    - "Reuben A. Saunders"
    - "Angela N. Pogson"
    - "Jeffrey A. Hussmann"
    - "Alexander Lenail"
    - "Alina Guna"
    - "Lauren Mascibroda"
    - "Eric J. Wagner"
    - "Karen Adelman"
    - "Gila Lithwick-Yanai"
    - "Nika Iremadze"
    - "Florian Oberstrass"
    - "Doron Lipson"
    - "Jessica L. Bonnar"
    - "Marco Jost"
    - "Thomas M. Norman"
    - "Jonathan S. Weissman"
  year: 2022
  venue: "Cell"
  venue_type: "journal"
  abstract: >-
    A central goal of genetics is to define the relationships between genotypes
    and phenotypes. High-content phenotypic screens such as Perturb-seq (CRISPR-
    based screens with single-cell RNA-sequencing readouts) enable massively
    parallel functional genomic mapping but, to date, have been used at limited
    scales. Here, we perform genome-scale Perturb-seq targeting all expressed
    genes with CRISPR interference (CRISPRi) across >2.5 million human cells. We
    use transcriptional phenotypes to predict the function of poorly
    characterized genes, uncovering new regulators of ribosome biogenesis
    (including CCDC86, ZNF236, and SPATA5L1), transcription (C7orf26), and
    mitochondrial respiration (TMEM242). In addition to assigning gene function,
    single-cell transcriptional phenotypes allow for in-depth dissection of
    complex cellular phenomena-from RNA processing to differentiation. We
    leverage this ability to systematically identify genetic drivers and
    consequences of aneuploidy and to discover an unanticipated layer of stress-
    specific regulation of the mitochondrial genome. Our information-rich
    genotype-phenotype map reveals a multidimensional portrait of gene and
    cellular function.
  url: "https://doi.org/10.1016/j.cell.2022.05.013"
