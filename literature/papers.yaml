- paper_id: "arxiv:2311.12570"
  doi: null
  title: "BEND: Benchmarking DNA Language Models on biologically meaningful tasks"
  authors:
    - "Frederikke Isa Marin"
    - "Felix Teufel"
    - "Marc Horlacher"
    - "Dennis Madsen"
    - "Dennis Pultz"
    - "Ole Winther"
    - "Wouter Boomsma"
  year: 2023
  venue: null
  venue_type: "conference"
  abstract: >-
    The genome sequence contains the blueprint for governing cellular processes.
    While the availability of genomes has vastly increased over the last
    decades, experimental annotation of the various functional, non-coding and
    regulatory elements encoded in the DNA sequence remains both expensive and
    challenging. This has sparked interest in unsupervised language modeling of
    genomic DNA, a paradigm that has seen great success for protein sequence
    data. Although various DNA language models have been proposed, evaluation
    tasks often differ between individual works, and might not fully
    recapitulate the fundamental challenges of genome annotation, including the
    length, scale and sparsity of the data. In this study, we introduce BEND, a
    Benchmark for DNA language models, featuring a collection of realistic and
    biologically meaningful downstream tasks defined on the human genome. We
    find that embeddings from current DNA LMs can approach performance of expert
    methods on some tasks, but only capture limited information about long-range
    features. BEND is available at https://github.com/frederikkemarin/BEND.
  url: "https://doi.org/arxiv:2311.12570"
