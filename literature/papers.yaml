- paper_id: "10.1101/2023.01.11.523679"
  doi: "10.1101/2023.01.11.523679"
  title: >-
    The Nucleotide Transformer: Building and Evaluating Robust Foundation Models
    for Human Genomics
  authors:
    - "Hugo Dalla-Torre"
    - "Liam Gonzalez"
    - "Javier Mendoza Revilla"
    - "Nicolas Lopez Carranza"
    - "Adam Henryk Grywaczewski"
