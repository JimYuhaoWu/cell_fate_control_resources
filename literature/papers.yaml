  year: 2023
  venue: "preprint"
  venue_type: "preprint"
  abstract: >-
    Closing the gap between measurable genetic information and observable traits
    is a longstanding challenge in genomics. Yet, the prediction of molecular
    phenotypes from DNA sequences alone remains limited and inaccurate, often
    driven by the scarcity of annotated data and the inability to transfer
    learnings between prediction tasks. Here, we present an extensive study of
    foundation models pre-trained on DNA sequences, named the Nucleotide
    Transformer, ranging from 50M up to 2.5B parameters and integrating
    information from 3,202 diverse human genomes, as well as 850 genomes
    selected across diverse phyla, including both model and non-model organisms.
    These transformer models yield transferable, context-specific
    representations of nucleotide sequences, which allow for accurate molecular
    phenotype prediction even in low-data settings. We show that the developed
    models can be fine-tuned at low cost and despite low available data regime
    to solve a variety of genomics applications. Despite no supervision, the
    transformer models learned to focus attention on key genomic elements,
    including those that regulate gene expression, such as enhancers. Lastly, we
    demonstrate that utilizing model representations can improve the
    prioritization of functional genetic variants. The training and application
    of foundational models in genomics explored in this study provide a widely
    applicable stepping stone to bridge the gap of accurate molecular phenotype
    prediction from DNA sequence. Code and weights available at:
    https://github.com/instadeepai/nucleotide-transformer in Jax and
    https://huggingface.co/InstaDeepAI in Pytorch. Example notebooks to apply
    these models to any downstream task are available on
    https://huggingface.co/docs/transformers/notebooks#pytorch-bio.
