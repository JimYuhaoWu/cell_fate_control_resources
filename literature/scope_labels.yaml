# literature/scope_labels.yaml
#
# The extensional boundary M4a asks for: every published record labelled in or
# out of scope against docs/scope_criteria.md, which is the procedure these
# labels apply. Written 2026-10-28.
#
# WHAT WAS DECIDED FROM. Each record's `name`, its `description` where it has
# one, and the title and abstract of its `primary` paper -- nothing else. That
# is the same evidence a curator or a script has for the 304 of 490 records
# that carry no description, and docs/scope_criteria.md was written to be
# decidable from it.
#
# `certainty` is part of the label, not a hedge about it. `clear` means the
# criterion decides the record outright; `arguable` means a reasonable curator
# could go the other way. The two give a floor and a ceiling: 170 records are
# clearly out, 227 are out on the wider reading. The `arguable` ones are where
# the boundary actually needs a decision, and each one settled sharpens the
# criteria for every record after it.
#
# `in_sample` marks the 102 records of the earlier seeded random sample, drawn
# before any of this pass was done. It is kept because it is evidence about the
# method rather than about the catalogue: the sample estimated 47.1% out and
# the full pass found 46.3%, so sampling would have given the same answer for a
# fiftieth of the work. The next audit does not need to be exhaustive.
#
#     rng = random.Random(20261028)
#     k   = max(2, round(100 * len(stratum) / 490))   # per type
#
# `type_defect` is NOT a scope label. Those records are in scope and entered
# under the wrong type -- a benchmark as a `model`, a critique as an entity
# instead of an entity_paper row, one resource entered twice. The criteria pass
# them, correctly, and they need a separate pass; see the audit report.
#
# PROVENANCE. These labels were assigned by Claude (Opus 5), not by the
# project's curator, and `ratified: false` says so. They are a measurement
# offered for review, not curatorial fact: a scope decision is the curator's to
# make, and the point of writing them down is that someone can disagree with a
# specific one and name the criterion they read differently. Nothing here
# withdraws a record -- M4a's fourth item, a demote path, does not exist yet.
#
# Regenerate nothing: this file is hand-assigned, not derived. reports/scope_audit.md
# is the summary computed from it.

method:
  labelled: '2026-10-28'
  population: 490
  labelled_by: claude-opus-5
  ratified: false
  criteria: docs/scope_criteria.md
  evidence: record name and description, plus primary paper title and abstract
  sample:
    seed: 20261028
    size: 102
    drawn: 2026-10-28, before the full pass
    stratified_by: type
  summary:
    out_clear: 170
    out_including_arguable: 227
    in: 263
    type_defect: 44
