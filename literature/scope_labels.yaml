# literature/scope_labels.yaml
#
# The labelled in/out set M4a asks for: the extensional boundary the catalogue
# did not have. docs/scope_criteria.md is the procedure; this is what it was
# written against and what it is measured on.
#
# HOW THE SAMPLE WAS DRAWN. A stratified random sample of the 490 published
# records, proportional by type, seeded so it is reproducible:
#
#     rng = random.Random(20261028)
#     k   = max(2, round(100 * len(stratum) / 490))   # per type
#
# The draw reproduces exactly only against the 490 records as they stood on that
# date: adding or removing one changes which records the seed selects. Re-label
# rather than re-draw, or the set stops being the thing the rate was measured on.
#
# Random and not hand-picked, because a set assembled by looking for mistakes
# measures only how good the looking was. Every record drawn is labelled, which
# is what makes the proportion an estimate of the catalogue rather than a tally.
#
# WHAT EACH LABEL WAS DECIDED FROM. The record's `name`, its `description` where
# it has one, and the title and abstract of its `primary` paper -- nothing else.
# That is the same evidence a curator or a script has for the 304 of 490 records
# that carry no description.
#
# `certainty` is part of the label, not a hedge about it. `clear` means the
# criterion decides the record outright; `arguable` means a reasonable curator
# could go the other way, and those records are where the boundary actually
# needs a decision. Reporting a rate without them would overstate the precision
# of the criteria; reporting only the union would overstate the drift.
#
# `type_defect` is NOT a scope label. These records are in scope and entered
# under the wrong type -- a benchmark as a `model`, a critique as an entity
# rather than as an entity_paper row. The criteria pass them, correctly, and
# they need a separate pass.
#
# PROVENANCE. These 102 labels were assigned by Claude (Opus 5) on 2026-10-28,
# not by the project's curator, and `ratified: false` says so. They are a
# measurement offered for review, not curatorial fact: a scope decision is the
# curator's to make, and the whole point of writing them down is that someone
# can disagree with a specific one and say which criterion they read
# differently. Set `ratified: true` per label, or in the header once the set has
# been read through.

method:
  drawn: '2026-10-28'
  seed: 20261028
  population: 490
  sampled: 102
  stratified_by: type
  strata:
    benchmark:
      population: 91
      sampled: 19
    database:
      population: 7
      sampled: 2
    dataset:
      population: 9
      sampled: 2
    model:
      population: 320
      sampled: 65
    module:
      population: 58
      sampled: 12
    protocol:
      population: 5
      sampled: 2
  ratified: false
  labelled_by: claude-opus-5
  criteria: docs/scope_criteria.md
