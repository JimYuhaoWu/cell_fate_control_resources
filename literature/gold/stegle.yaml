# literature/gold/stegle.yaml
#
# An external denominator for `literature/query_coverage.py`, so that the reach
# of `literature/search_queries.yaml` can be measured against a set CFCR did
# not assemble. Every other number about the clause file divides by records the
# clauses themselves found, which cannot show a resource no clause has ever had
# a term for.
#
# Source: PMBio/interp-extrap-perturb at b36ade82b7bee3820684d5ab6e7c74221b0caad2
# (2026-09-07), the living catalogue behind Dimitrov, Schrod, Rohbeck & Stegle,
# *Nature Reviews Genetics* 2026. 156 methods, one YAML file each, so the list
# is taken verbatim and only the labels below are CFCR's.
#
# Method of measurement follows Nasser et al., arXiv:2602.00011 (chained
# prompting for systematic review search strategies): **recall only**, against
# the items an external completed review included, on the grounds that
# precision is a downstream concern. CFCR already reports precision separately
# as the discrimination number, so the two stay apart here too. Two of that
# paper's choices are deliberately not copied -- it excluded reviews whose
# strategy returned more than 1,000 hits, and its headline figure applies a
# post-hoc ">0.2 recall only" filter to its own rows but not to its baselines.
# Both flatter the result. Nothing here is excluded for being hard to reach;
# an entry our sources cannot index is reported as its own category.
#
# `in_scope` applies docs/scope_criteria.md to each entry, from the method name,
# task list and description the catalogue carries -- the same title-and-abstract
# constraint the criteria were written under. `why` names the criterion that
# decided it. The task vocabulary is the catalogue's own and does most of the
# work: C5 admits a resource that predicts a perturbation response and excludes
# one that only embeds or integrates, and `Seen`/`Unseen`/`Combinatorial`
# prediction is that distinction already drawn by someone else. The 16 entries
# whose only prediction-adjacent task is `Context Transfer` were read one at a
# time.
#
# **One criterion is suspended, and it matters.** C2 requires the substrate to
# be genomic DNA sequence or chromatin state. Read literally it puts every
# entry here out of scope, since these are expression-matrix methods -- and it
# would equally withdraw `model:gears`, `model:scgpt`, `model:scgenept` and
# `model:scldm`, which the catalogue publishes today. So C2 is applied as the
# catalogue applies it in practice, admitting the `what` axis on gene-level
# perturbation of the genome, and the conflict is recorded rather than settled
# here: it is M4b's to resolve, with issue #20.
#
# `identifier` is what `query_coverage.py` matches a cached hit against. It is
# derived from the publication URL where the URL carries a DOI or arXiv id, and
# otherwise by an OpenAlex title search whose match was checked by eye;
# `identifier_from` says which. Eight in-scope entries are published only at a
# venue with no DOI and no preprint our sources index, and carry null: that is
# a source-coverage gap, not a vocabulary gap, and the report keeps it separate.

