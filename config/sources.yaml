# config/sources.yaml
#
# External metadata sources this pipeline reads, following the eCR_mod_lib
# convention of recording every external URL, version and DOI in one place.
# CFCR stores only open metadata (schema §2.2): no full text of paywalled work.

# Four APIs, one job each. The split is the point: M3's triage has to find the
# papers that *evaluate* a model, and no keyword query finds those. They are
# reached by walking the citation graph of the primary paper, which is a
# different capability from search, so it gets its own source.
metadata_apis:
  - name: europepmc
    url: https://www.ebi.ac.uk/europepmc/webservices/rest/search
    role: discovery
    purpose: keyword search over the life-science literature, preprints included
    # Stands in for separate PubMed and bioRxiv clients rather than sitting
    # beside them: Europe PMC indexes every PubMed/MEDLINE abstract and 31+
    # preprint servers, bioRxiv and medRxiv among them and filterable as
    # SRC:PPR, under one query language and with no API key. bioRxiv's own API
    # has no keyword search endpoint at all -- only date-range listing, 30
    # records a call -- so querying it directly would mean crawling every
    # preprint posted in a window and filtering locally.
    note: also supplies the abstracts Crossref omits for Nature-family journals
  - name: arxiv
    url: https://export.arxiv.org/api/query
    role: discovery
    purpose: machine-learning venues Europe PMC does not index (ICLR, ICML, NeurIPS)
    # Checked, not assumed: BEND (arXiv:2311.12570, ICLR 2024), already a
    # `benchmark` record here, returns no match in Europe PMC, while arXiv
    # gives its title, seven authors and a 1,109-character abstract.
    note: rate-limited, one request every few seconds; http:// 301s to https
  - name: openalex
    url: https://api.openalex.org/works
    role: citations
    purpose: >
      The papers citing a primary paper -- the candidate pool for the
      `benchmark` and `critique` roles that evidence_tier is derived from.
    # Preferred to Semantic Scholar on a test against the two Enformer
    # critiques already catalogued here: filter=cites:W3203588026,doi:<doi>
    # returns each of them in a single call. Keyless Semantic Scholar answered
    # the same lookup with a null citationCount, surfaced one of the two inside
    # the first 1,000 of Enformer's 1,325 citations, and did not find BEND.
    contact_email: yuhaow9412@gmail.com
    # A key is required for citation work, not an optimisation. OpenAlex moved
    # to a per-call budget priced in dollars: measured against the live API on
    # 2026-10-28, X-RateLimit-Limit-USD is 0.10 a day without a key, a
    # filter call costs 0.0001 and a search call 0.001 -- so keyless is a
    # thousand filter calls or a hundred searches, shared by everyone on this
    # network's IP, and the sweep's 471 primaries plus their citing pages do
    # not fit. The quoted figure for a free key is tenfold that; unverified
    # here, because there is no key yet.
    #
    # The address is still sent and still polite, but it no longer grants a
    # quota of its own, which is what the note here used to claim.
    api_key_env: OPENALEX_API_KEY
    note: >
      The key is read from the OPENALEX_API_KEY environment variable and sent
      as an Authorization: Bearer header -- never written into this file or any
      other, the same way 07_enrich.py reaches GitHub through `gh` rather than
      holding a token. Absent, the pipeline runs on the keyless budget and says
      so. A free key is issued at https://openalex.org/settings/api-key.
  - name: crossref
    url: https://api.crossref.org/works
    role: resolution
    purpose: DOI resolution, titles, author lists, venues
    # Crossref's "polite pool": sending a contact address in the User-Agent
    # gets faster, more predictable service than the shared anonymous pool.
    contact_email: yuhaow9412@gmail.com

ontologies:
  - name: NCBITaxon
    facet: organism
    resolver: https://www.ebi.ac.uk/ols4/api/search
  - name: CL
    facet: cell_type
    resolver: https://www.ebi.ac.uk/ols4/api/search
    note: does not model immortalized cell lines; EFO is used for those
  - name: EFO
    facet: [cell_type, assay]
    resolver: https://www.ebi.ac.uk/ols4/api/search

sibling_projects:
  - name: eCR_mod_lib
    url: https://github.com/JimYuhaoWu/eCR_mod_lib
    purpose: >
      Tier 2 module records (~10,800 DBD/ED/CR). Joined from CFCR via
      module_collection_ext.ecr_lib_source_key -> eCR_mod_lib source_screen.
  - name: interp-extrap-perturb
    url: https://interp-extrap-perturb.readthedocs.io
    purpose: >
      Authoritative catalogue for the `what` axis (perturbation methods).
      CFCR links out rather than competing.
